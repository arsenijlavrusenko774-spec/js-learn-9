<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo: client + server</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">JavaScript · HTTP · Express · fetch</p>
    <h1>Todo API</h1>
    <p>Клиентская страница получает и изменяет данные через собственный Express API.</p>

    <form id="todo-form" class="form">
      <input id="todo-text" name="text" placeholder="Новая задача" autocomplete="off" required>
      <button type="submit">Добавить</button>
    </form>

    <p id="message" aria-live="polite"></p>
    <ul id="todo-list" class="todo-list"></ul>
  </main>
  <script src="app.js"></script>
</body>
</html>
